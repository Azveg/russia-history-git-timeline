name: Deploy to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Pages
        id: configure_pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Resolve and check lockfile tarball integrity
        run: |
          npm run sync:lock-integrity
          npm run sync:lock-integrity -- --check

      - name: Install dependencies (deterministic lockfile)
        run: npm ci

      - name: Security audit (all dependencies)
        run: npm audit --audit-level=high

      - name: Verify multi-agent governance & UI invariants
        run: npm run verify:invariants

      - name: Validate historical JSON modules & branch manifests (strict)
        run: npm run validate:branches:strict

      - name: Verify BRANCH_CATALOG.md is in sync
        run: npm run sync:catalog:check

      - name: Typecheck codebase
        run: npm run lint

      - name: Run automated unit & integration tests
        run: npm test

      - name: Build static bundle with canonical GitHub Pages URL
        env:
          NODE_ENV: production
          VITE_SITE_URL: ${{ steps.configure_pages.outputs.base_url || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ./dist

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
