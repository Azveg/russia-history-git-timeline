name: Deploy to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        id: configure_pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies (deterministic lockfile)
        run: npm ci

      - name: Security audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

      - name: Verify multi-agent governance & UI invariants
        run: npm run verify:invariants

      - name: Validate historical JSON modules & branch manifests (strict)
        run: npm run validate:branches:strict

      - name: Verify BRANCH_CATALOG.md is in sync
        run: npm run sync:catalog:check

      - name: Typecheck codebase
        run: npm run lint

      - name: Run automated unit & integration tests
        run: npm test

      - name: Build static bundle with canonical GitHub Pages URL
        env:
          NODE_ENV: production
          VITE_SITE_URL: ${{ steps.configure_pages.outputs.base_url || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
