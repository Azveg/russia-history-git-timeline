name: Sync Branch Catalog

on:
  pull_request:
    paths:
      - "public/data/**/*.json"
      - "scripts/sync-branch-catalog.mjs"
      - "scripts/validate-branches.mjs"
      - "scripts/timelineModules.mjs"
  push:
    branches: ["main", "master"]
    paths:
      - "public/data/**/*.json"
      - "scripts/sync-branch-catalog.mjs"
      - "scripts/validate-branches.mjs"
      - "scripts/timelineModules.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-catalog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Validate all branch JSON modules (strict)
        run: npm run validate:branches:strict

      - name: Check catalog sync preview on Pull Request
        if: github.event_name == 'pull_request'
        run: |
          if npm run sync:catalog:check; then
            echo "BRANCH_CATALOG.md is up to date." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "BRANCH_CATALOG.md will be automatically regenerated on merge to main/master." >> "$GITHUB_STEP_SUMMARY"
          fi

  sync-on-main:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Regenerate BRANCH_CATALOG.md
        run: |
          npm run sync:catalog
          npm run sync:catalog:check

      - name: Commit updated BRANCH_CATALOG.md
        run: |
          if [ -n "$(git status --porcelain BRANCH_CATALOG.md)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add BRANCH_CATALOG.md
            git commit -m "docs(catalog): update BRANCH_CATALOG.md [skip ci]"
            git push
            echo "Committed updated BRANCH_CATALOG.md." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "BRANCH_CATALOG.md is already up to date." >> "$GITHUB_STEP_SUMMARY"
          fi
